<body>
<header class="top"><div class="top-inner"><a href="#/" class="logo"><span class="mark" aria-hidden="true">✦</span>추리주리</a><a href="#/admin" class="manage" id="admin-link">관리자 로그인</a><button type="button" class="manage" id="admin-logout" hidden>로그아웃</button></div></header>
<main id="app" class="wrap"></main>
<footer class="foot"><div class="foot-inner"><span class="mark" aria-hidden="true">✦</span>추리주리</div></footer>
<script>
const seedMysteries = [
  {id:'m1',title:'생일 촛불',question:'케이크 위의 초에는 10이라는 숫자가 적혀 있었다. 케이크의 주인공 민서는 일곱 살인데, 가족들은 오늘 민서를 위해 10이라는 숫자를 골랐다. 왜였을까?',answer:'민서는 반려견이다. 가족들은 민서의 생일 대신 입양한 날을 기념하고 있었다. 10은 나이가 아니라 입양한 날짜인 10일을 뜻했다.'},
  {id:'m2',title:'젖은 우산',question:'비 한 방울 내리지 않은 날, 지훈은 우산을 펴고 집을 나섰다. 집에 도착했을 때 우산은 흠뻑 젖어 있었다. 무슨 일이 있었을까?',answer:'지훈은 물총 놀이를 하는 동네 축제에 갔다. 우산을 방패처럼 펼친 채 물총 세례를 받았다.'},
  {id:'m3',title:'한밤중의 박수',question:'불이 꺼진 방에 들어간 수아가 손뼉을 두 번 치자, 방 안의 사람들이 모두 안심했다. 왜였을까?',answer:'정전으로 어두워진 연습실에서 사람들은 출입구 위치를 찾고 있었다. 문에 도착한 수아가 약속한 신호로 손뼉을 쳐서 출입구를 알려준 것이다.'}
];
const seedSets = [
  {id:'s1',title:'몸으로 말해요',author:'추리주리',words:['고양이','피아노','선풍기','우산','롤러코스터','로봇','드럼','문어','줄넘기','헬리콥터','토끼','볼링','엘리베이터','청소기','펭귄','축구','거미','트램펄린','기타','기린']},
  {id:'s2',title:'먹을거리',author:'추리주리',words:['붕어빵','떡볶이','김밥','초밥','타코','크루아상','팥빙수','피자','만두','쌀국수','짬뽕','콜라','샌드위치','닭강정','순두부','수박','멜론','아이스크림','카레','호떡']}
];
const app = document.querySelector('#app');
const adminLink = document.querySelector('#admin-link');
const adminLogout = document.querySelector('#admin-logout');
const keys = {mysteries:'churijuri.v1.mysteries',sets:'churijuri.v1.sets'};
const datasets = {mysteries:seedMysteries,sets:seedSets};
const projectUrl = 'https://fpwivbuzsyzhbmupvlxh.supabase.co'; // Supabase Project URL
const publishableKey = 'sb_publishable_kgBbUfR-1nW_rWc0ygOxWA_OmEdW6UJ'; // Supabase publishable key
const cloudEnabled = Boolean(projectUrl && publishableKey);
const tables = {mysteries:'churijuri_mysteries',sets:'churijuri_card_sets'};
const sessionKey = 'churijuri.admin:'+projectUrl;
const cloudCache = {};
let adminSession;
try { adminSession = JSON.parse(sessionStorage.getItem(sessionKey)); } catch {}
let syncPending;
let syncError = false;
let mutationPending = false;
const isAdmin = () => Boolean(adminSession?.user?.app_metadata?.churijuri_admin === true && adminSession.expires_at > Date.now()/1000);
const cacheKey = type => keys[type]+':'+projectUrl;
async function request(path, {method='GET',body,admin=false,write=false,signal}={}) {
  const headers = {apikey:publishableKey};
  if(admin){
    if(!isAdmin())throw new Error('관리자 로그인이 필요해요.');
    headers.Authorization='Bearer '+adminSession.access_token;
  }
  if(body!==undefined)headers['Content-Type']='application/json';
  if(write)headers.Prefer='return=minimal';
  const response=await fetch(projectUrl.replace(/\/$/,'')+path,{method,headers,signal,body:body===undefined?undefined:JSON.stringify(body)});
  if(!response.ok){
    if(path==='/rest/v1/rpc/cj_mafia'||path==='/rest/v1/rpc/cj_majority'){const error=await response.json().catch(()=>({}));throw new Error(error.message||'Mafia request failed');}
    const error=new Error('Supabase HTTP '+response.status);
    error.status=response.status;
    if(path.startsWith('/auth/v1/token?')){
      const details=await response.json().catch(()=>null);
      error.code=details?.error_code??details?.code??details?.error;
    }
    throw error;
  }
  if(response.status===204||response.headers.get('content-length')==='0')return;

function refreshCloud(){
  if(!cloudEnabled)return Promise.resolve();
  if(syncPending)return syncPending;
  syncPending=Promise.all([
    request('/rest/v1/'+tables.mysteries+'?select=id,title,question,answer&order=sort_order.asc'),
    request('/rest/v1/'+tables.sets+'?select=id,title,author,words&order=created_at.asc,id.asc')
  ]).then(([mysteries,sets])=>{
    syncError=false;
    for(const [type,items] of Object.entries({mysteries,sets})){
      cloudCache[type]=items;
      try {localStorage.setItem(cacheKey(type),JSON.stringify(items));} catch {}
    }
  }).catch(()=>{syncError=true;}).finally(()=>{syncPending=null;});
  return syncPending;
}

async function storeChange(type,list,change){
  if(!cloudEnabled)return save(type,list);
  if(mutationPending)return false;
  mutationPending=true;
  const control=app.querySelector('button[type=submit],form button:not([type])');
  if(control)control.disabled=true;
  try{
    if(syncPending)await syncPending;
    const table='/rest/v1/'+tables[type];
    const filter='?id=eq.'+encodeURIComponent(change.id);
    if(change.method==='MOVE'){
      await request('/rest/v1/rpc/churijuri_move_mystery',{method:'POST',body:{item_id:change.id,move_up:change.up},admin:true,write:true});
    }else{
      const path=change.method==='POST'?table:table+filter;
      await request(path,{method:change.method,body:change.body,admin:change.method==='PATCH'||change.method==='DELETE',write:true});
    }
    cloudCache[type]=list;
    await refreshCloud();
    return true;
  }catch{
    return false;
  }finally{
    mutationPending=false;
    if(control)control.disabled=false;
  }
}

function sound(){
  if(!audioContext||audioContext.state!=='running')return;
  const start=audioContext.currentTime;
  [660,660,880].forEach((pitch,index)=>{
    const oscillator=audioContext.createOscillator();
    const volume=audioContext.createGain();
    const time=start+index*.16;
    oscillator.frequency.value=pitch;
    volume.gain.setValueAtTime(.001,time);
    volume.gain.exponentialRampToValueAtTime(.27,time+.018);
    volume.gain.exponentialRampToValueAtTime(.001,time+.125);
    oscillator.connect(volume).connect(audioContext.destination);
    oscillator.start(time);
    oscillator.stop(time+.14);
  });
}

  const seconds=Math.ceil(remaining/1000);
  const clock=document.querySelector('#clock');
  if(!clock)return;
  clock.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');
  clock.classList.toggle('urgent',seconds<=10);
  timeout=setTimeout(updateClock,Math.max(20,remaining-(seconds-1)*1000));
}

async function startLiar(form,fields){
  const count=Number(fields.get('count'));
  const choice=String(fields.get('category')??'');
  if(!Number.isInteger(count)||count<3||count>20||choice&&!Object.hasOwn(liarPairs,choice))return;
  const categories=Object.keys(liarPairs);
  const category=choice||categories[Math.floor(Math.random()*categories.length)];
  const button=form.querySelector('button[type=submit]');
  if(button.disabled)return;
  button.disabled=true;
  let pairs=liarPairs[category];
  try{
    if(cloudEnabled&&navigator.onLine){
      const rows=await request('/rest/v1/churijuri_liar_pairs?select=word_a,word_b&category=eq.'+encodeURIComponent(category),{signal:AbortSignal.timeout(2500)});
      if(Array.isArray(rows))pairs=rows.map(row=>[row.word_a,row.word_b]);
    }
  }catch{}finally{button.disabled=false;}
  if(!form.isConnected)return;
  if(!pairs.length){issue('이 카테고리에 단어 쌍이 없어요. 다른 카테고리를 골라 주세요.');return;}
  const unused=pairs.filter(pair=>JSON.stringify([...pair].sort())!==liarPrevious.get(category));
  const pool=unused.length?unused:pairs;
  const pair=pool[Math.floor(Math.random()*pool.length)];
  liarPrevious.set(category,JSON.stringify([...pair].sort()));
  const swap=Math.random()<0.5?0:1;
  liarSetup.count=count;
  liarSetup.category=choice;
  liarRound={count,index:0,phase:'pass',revealed:false,liar:Math.floor(Math.random()*count),common:pair[swap],secret:pair[1-swap]};
  location.hash='/liar/play';
}

async function loadManagedPairs(){

function renderManagedPairs(){

  list.innerHTML='<p role="status">'+visible.length+' / '+managedRows.length+'쌍</p>'+ (visible.map(({row,i})=>'<div class="row"><h2>'+escapeHTML(row.word_a)+' · '+escapeHTML(row.word_b)+'</h2><button type="button" class="button secondary small" data-action="liar-edit" data-id="'+i+'" aria-label="'+escapeHTML(row.word_a+' · '+row.word_b+' 수정')+'">수정</button></div>').join('')||'<p class="empty">'+(managedRows.length?'검색 결과가 없어요.':'이 카테고리에 등록된 단어 쌍이 없어요.')+'</p>');

function selectManagedPair(pair){
  const form=app.querySelector('#liar-manage');
  managedPair=pair;
  form.elements.word_a.value=pair?.word_a??'';
  form.elements.word_b.value=pair?.word_b??'';
  form.querySelector('[type=submit]').textContent=pair?'수정 저장':'단어 쌍 추가';
  for(const control of form.querySelectorAll('[data-action]'))control.hidden=!pair;
}

async function saveManagedPair(form,remove=false){
  if(!isAdmin()){issue('다시 로그인해 주세요.');return;}
  if(mutationPending)return;
  const pair=managedPair;
  if(remove&&!pair)return;
  const word_a=form.elements.word_a.value.trim();
  const word_b=form.elements.word_b.value.trim();
  if(!remove&&(!word_a||!word_b||word_a===word_b)){issue('서로 다른 두 단어를 입력해 주세요.');return;}
  if(!remove&&managedRows.some(row=>row!==pair&&((row.word_a===word_a&&row.word_b===word_b)||(row.word_a===word_b&&row.word_b===word_a)))){
    issue('이미 등록된 단어 쌍이에요.');return;
  }
  const category=managedCategory;
  mutationPending=true;
  const controls=[...form.elements];
  for(const control of controls)control.disabled=true;
  try{
    await request(liarTable+(pair?pairFilter(category,pair):''),{
      method:remove?'DELETE':pair?'PATCH':'POST',admin:true,write:true,
      body:remove?undefined:pair?{word_a,word_b}:{category,word_a,word_b}
    });
    if(!form.isConnected)return;
    selectManagedPair(null);
    issue(remove?'단어 쌍을 삭제했어요.':'단어 쌍을 저장했어요.');
    await loadManagedPairs();
  }catch{
    if(form.isConnected)issue('변경을 저장하지 못했어요. 연결과 관리자 로그인 상태를 확인해 주세요.');
  }finally{
    mutationPending=false;
    for(const control of controls)control.disabled=false;
  }
}

async function mafiaPoll(){
  const [page,id]=route();
  if(page!=='mafia'||id==='new'||mafiaBusy||mafiaPolling)return;
  const key=location.hash;
  mafiaPolling=true;
  try{
    if(mafiaRoomPattern.test(id??'')){
      const state=await mafiaRpc('state',id);
      if(location.hash!==key||mafiaBusy)return;
      if(JSON.stringify(state)!==JSON.stringify(mafiaState)){mafiaState=state;mafiaMessage='';render();}
    }else{
      const rooms=await mafiaRpc('list');
      if(location.hash!==key||mafiaBusy)return;
      if(!mafiaLoaded||JSON.stringify(rooms)!==JSON.stringify(mafiaRooms)){mafiaRooms=rooms;mafiaLoaded=true;mafiaMessage='';render();}
    }
  }catch(error){
    if(location.hash===key&&error.message!=='Join first')mafiaError(error);
  }finally{mafiaPolling=false;}

async function mafiaCommand(op,id,data={},control){

  const key=location.hash;

  if(control)control.disabled=true;
  try{
    const state=await mafiaRpc(op,id,data);
    if(location.hash!==key)return;
    mafiaMessage='';
    if(op==='create'){rememberMafiaRoom(state.id);location.hash='/mafia/'+state.id;}
    else{if(op==='join')rememberMafiaRoom(state.id);mafiaState=state;render();}
  }catch(error){if(location.hash===key)mafiaError(error);}
  finally{mafiaBusy=false;if(control)control.disabled=false;}
}

async function truthSave(form){
  if(!isAdmin()||mutationPending)return;
  const fields=new FormData(form),question=String(fields.get('question')??'').trim();
  if(!question){issue('질문을 입력해 주세요.');return;}
  const controls=[...form.elements];
  mutationPending=true;
  controls.forEach(control=>control.disabled=true);
  try{
    await request(truthTable+(truthEdit?'?id=eq.'+encodeURIComponent(truthEdit.id):''),{method:truthEdit?'PATCH':'POST',admin:true,write:true,body:truthEdit?{question}:{heat:'가벼운맛',question}});
    truthEdit=null;truthCards=null;truthFailed=false;
    if(form.isConnected)render();
  }catch{if(form.isConnected)issue('저장하지 못했어요. 관리자 로그인을 확인해 주세요.');}
  finally{mutationPending=false;controls.forEach(control=>control.disabled=false);}
}

const majorityTable='/rest/v1/cj_majority_cards';
const majorityRpcPath='/rest/v1/rpc/cj_majority';
let majorityRooms=null,majorityState,majorityBusy=false,majorityPollPending=false,majorityVersion=0;
let majorityCards=null,majorityLoading=false,majorityLoadError=false,majorityEdit=null;
const majorityResumeKey='churijuri.majority.room';
function majorityRemember(id){try{localStorage.setItem(majorityResumeKey,id);}catch{}}
function majorityResume(){try{return localStorage.getItem(majorityResumeKey);}catch{return null;}}
function majorityRpc(op,id=null,data={}){
  return request(majorityRpcPath,{method:'POST',body:{op,rid:id,token:op==='list'?null:getMafiaToken(),data},signal:AbortSignal.timeout?.(8000)});
}
const majorityButton=(action,label,style='secondary',id='')=>'<button type="button" class="button '+style+'" data-action="majority-'+action+'" data-id="'+escapeHTML(id)+'">'+escapeHTML(label)+'</button>';
const majorityFeedback='<p class="status" role="status" id="majority-status"></p>';
function majorityMessage(message){const el=app.querySelector('#majority-status');if(el)el.textContent=message;}
function majorityError(error){
  const messages={'Nickname used':'이미 쓰는 닉네임이에요.','Room unavailable':'이미 시작했거나 입장할 수 없는 방이에요.','Need 2 players':'최소 2명이 모여야 시작할 수 있어요.','No questions':'등록된 질문이 없어요.'};
  majorityMessage(messages[error.message]??'연결 상태를 확인하고 다시 시도해 주세요.');
}

async function majorityPoll(){
  const [page,id]=route();
  if(page!=='majority'||id==='new'||majorityBusy||majorityPollPending)return;
  if(id&&majorityState?.id!==id&&majorityResume()!==id)return;
  const version=majorityVersion,hash=location.hash;
  majorityPollPending=true;
  try{
    const state=await majorityRpc(id?'state':'list',id??null);
    if(hash!==location.hash||version!==majorityVersion||majorityBusy)return;
    if(JSON.stringify(state)!==JSON.stringify(id?majorityState:majorityRooms)){
      if(id)majorityState=state;else majorityRooms=state;
      render();
    }
  }catch(error){if(hash===location.hash&&error.message!=='Join first')majorityError(error);}
  finally{majorityPollPending=false;}
}
async function majorityCommand(op,id,data={},button){
  if(majorityBusy)return;
  const hash=location.hash;
  majorityBusy=true;majorityVersion++;
  if(button)button.disabled=true;
  try{
    const state=await majorityRpc(op,id,data);
    if(op==='join'||op==='create')majorityRemember(state.id);
    if(hash!==location.hash)return;
    if(op==='create')location.hash='/majority/'+state.id;
    else{majorityState=state;render();}
  }catch(error){if(hash===location.hash)majorityError(error);}
  finally{majorityBusy=false;if(button)button.disabled=false;}
}

async function majoritySave(form,deleteId){
  if(!isAdmin()||mutationPending)return;
  const id=deleteId||majorityEdit?.id;

    majorityMessage('질문과 서로 다른 선택지 두 개를 입력해 주세요.');return;
  }
  mutationPending=true;
  try{
    await request(majorityTable+(id?'?id=eq.'+encodeURIComponent(id):''),{method:deleteId?'DELETE':id?'PATCH':'POST',admin:true,write:true,body});

  }catch{majorityMessage('저장할 수 없어요. 관리자 로그인과 연결을 확인해 주세요.');}
  finally{mutationPending=false;}
}

function render(){
  clearTimeout(timeout);
  readRecoveryLink();
  const path=route();
  if(path[0]!=='reset')recoveryToken=null;
  const [page,id,mode]=path;
  const routeKey=path.join('/');
  if(routeKey!==previousRoute)answerVisible=false;
  if(previousRoute.endsWith('/play')&&mode!=='play')game=null;
  const changed=routeKey!==previousRoute;
  previousRoute=routeKey;
  const signedIn=isAdmin();
  adminLink.hidden=signedIn;
  adminLogout.hidden=!signedIn;
  if(page==='admin')adminLink.setAttribute('aria-current','page');
  else adminLink.removeAttribute('aria-current');
  if(page!=='liar'||id!=='play')liarRound=null;
  if(page==='nominate'){
    if(id!==nominateLast){nominateHidden=false;nominateLast=id;}
    nominatePage(id);
  }else if(page==='majority')majorityView(id);
  else if(page==='truth')truthPage(id);
  else if(page==='mafia'){
    if(location.hash!==mafiaKey){mafiaKey=location.hash;mafiaMessage='';}
    mafiaView(id);
  }else if(page==='liar')liarGame(id);
  else if(page==='reset')resetPage();
  else if(page==='mysteries')mysteries(id);
  else if(page==='admin')admin(id);
  else if(page==='cards'){
    if(!id)cards();
    else if(id==='new')newSet();
    else if(mode==='play')play(id);
    else setup(id);
  } else home();
  if(changed){window.scrollTo(0,0);app.tabIndex=-1;app.focus({preventScroll:true});}
}
const parseWords = value => value.split(/\r\n|\r|\n/).map(word=>word.trim()).filter(Boolean);
app.addEventListener('input', event=>{
  if(event.target.id==='liar-admin-search')renderManagedPairs();
  if(event.target.name==='words')document.querySelector('#word-count').textContent=parseWords(event.target.value).length+'개';
});
app.addEventListener('change',event=>{
  if(event.target.name==='mode'&&event.target.form?.id==='mafia-create'){document.querySelector('#mafia-times').hidden=event.target.value==='manual';return;}
  if(event.target.name!=='manage-category')return;
  managedCategory=event.target.value;
  app.querySelector('#liar-admin-search').value='';
  selectManagedPair(null);
  issue('');
  loadManagedPairs();
});
app.addEventListener('submit',async event=>{
  event.preventDefault();
  const form=event.target;
  const fields=new FormData(form);
  const value=key=>String(fields.get(key)??'').trim();
  if(form.id==='mafia-create'||form.id==='mafia-join'){
    await mafiaCommand(form.id==='mafia-create'?'create':'join',route()[1]==='new'?null:route()[1],Object.fromEntries(fields),form.querySelector('button'));
    return;
  }
  if(form.id==='nominate-admin'){await nominateSave(form);return;}
  if(form.id==='majority-admin'){await majoritySave(form);return;}
  if(form.id==='majority-create'||form.id==='majority-join'){
    const create=form.id==='majority-create';
    await majorityCommand(create?'create':'join',create?null:route()[1],Object.fromEntries(fields),form.querySelector('button'));
    return;
  }
  if(form.id==='truth-admin'){await truthSave(form);return;}
  if(form.id==='truth-start'){
    truthDeck=[...(truthCards??[])];
    if(!truthDeck.length){issue('등록된 카드가 없어요.');return;}
    for(let i=truthDeck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[truthDeck[i],truthDeck[j]]=[truthDeck[j],truthDeck[i]];}
    truthIndex=0;location.hash='/truth/play';return;
  }
  if(form.id==='liar-manage'){await saveManagedPair(form);return;}
  if(form.id==='liar-setup'){await startLiar(form,fields);return;}
  if(form.id==='liar-vote'&&liarRound?.phase==='vote'){
    const selected=fields.get('vote');
    const vote=Number(selected);
    if(selected!==''&&Number.isInteger(vote)&&vote>=0&&vote<liarRound.count){liarRound.vote=vote;liarRound.phase='result';render();}
    return;
  }
  if(form.id==='reset-form'){
    const password=fields.get('password');
    if(password!==fields.get('confirm')){issue('두 비밀번호가 달라요. 다시 확인해 주세요.');return;}
    const button=form.querySelector('button');
    button.disabled=true;
    try{
      const response=await fetch(projectUrl+'/auth/v1/user',{
        method:'PUT',headers:{apikey:publishableKey,Authorization:'Bearer '+recoveryToken,'Content-Type':'application/json'},
        body:JSON.stringify({password})
      });
      if(!response.ok){
        const error=await response.json().catch(()=>({}));
        if(response.status===401||response.status===403){recoveryToken=null;resetPage();}
        else issue(error.code==='same_password'?'이전과 다른 비밀번호를 입력해 주세요.':'비밀번호를 저장하지 못했어요. 새 비밀번호와 복구 링크를 확인해 주세요.');
        return;
      }
      recoveryToken=null;
      display(heading('비밀번호를 변경했어요')+'<a class="button purple" href="#/admin">관리자 로그인</a>');
    }catch{issue('연결을 확인하고 다시 시도해 주세요.');}
    finally{button.disabled=false;}
    return;
  }
  if(form.id==='admin-form'){
    const control=form.querySelector('button[type=submit]');
    control.disabled=true;
    try{
      const session=await request('/auth/v1/token?grant_type=password',{method:'POST',body:{email:value('email').toLowerCase(),password:fields.get('password')}});
      if(!session?.user?.app_metadata?.churijuri_admin){issue('이 계정에는 추리주리 관리자 권한이 없어요.');return;}
      adminSession={access_token:session.access_token,expires_at:session.expires_at??Math.floor(Date.now()/1000)+session.expires_in,user:{app_metadata:{churijuri_admin:true}}};
      try {sessionStorage.setItem(sessionKey,JSON.stringify(adminSession));} catch {}
      render();
      refreshPage();
    }catch(error){
      if(error.code==='invalid_credentials'||error.code==='invalid_grant'){
        issue('로그인 정보가 일치하지 않아요. 비밀번호 옆 보기 버튼으로 입력한 내용을 확인해 주세요.');
      }else if(error.code==='email_not_confirmed'){
        issue('이메일 인증이 필요한 계정이에요.');
      }else if(error.status===429){
        issue('로그인 시도가 너무 많아요. 잠시 후 다시 시도해 주세요.');
      }else{
        issue('로그인 서버에 연결하지 못했어요. 연결을 확인하고 다시 시도해 주세요.');
      }
    }
    finally{control.disabled=false;}
  }else if(form.id==='set-form'){
    const title=value('title'),author=value('author'),words=parseWords(value('words'));
    if(!title||!author||!words.length){issue('제목, 출제자 이름, 단어를 입력해 주세요.');return;}
    if(words.length>300||words.some(word=>word.length>200)){issue('단어는 최대 300개까지, 각 항목은 200자 이내로 입력해 주세요.');return;}
    const newItem={id:makeId(),title,author,words};
    if(!await storeChange('sets',[...records('sets'),newItem],{method:'POST',body:newItem})){issue(saveError());return;}
    location.hash='/cards';
  }else if(form.id==='mystery-form'){
    const title=value('title'),question=value('question'),answer=value('answer');
    if(!title||!question||!answer){issue('제목, 문제, 정답을 모두 입력해 주세요.');return;}
    const id=form.dataset.id;
    const list=records('mysteries');
    const entry={id:id||makeId(),title,question,answer};
    const change=id?{method:'PATCH',id,body:{title,question,answer}}:{method:'POST',body:entry};
    if(!await storeChange('mysteries',id?list.map(item=>item.id===id?entry:item):[...list,entry],change)){issue(saveError());return;}
    location.hash=form.dataset.public?'/mysteries':'/admin';
  }else if(form.id==='duration-form'){
    const seconds=Number(value('seconds'));
    const set=records('sets').find(item=>item.id===form.dataset.id);
    if(set&&Number.isInteger(seconds)&&seconds>=1&&seconds<=3600){
      begin(set,seconds);
      if(route()[2]==='play')render();
    }
  }
});
adminLogout.addEventListener('click',()=>{
  adminSession=null;
  answerVisible=false;
  try {sessionStorage.removeItem(sessionKey);} catch {}
  render();
});

app.addEventListener('click',async event=>{
  const button=event.target.closest('[data-action]');
  if(!button)return;
  const {action,id,seconds}=button.dataset;
  if(action.startsWith('majority-')){
    const op=action.slice(9);
    if(['edit','cancel','retry','delete'].includes(op)){
      if(!isAdmin()||mutationPending)return;
      if(op==='delete'){
        if(confirm('이 질문을 삭제할까요?'))await majoritySave(null,id);
      }else{
        majorityEdit=op==='edit'?majorityCards?.find(card=>card.id===id):null;
        if(op==='retry')majorityLoadError=false;
        render();
        if(op==='edit')app.querySelector('#majority-admin [name=prompt]')?.focus();
      }
    }else if(op!=='close'||confirm('이 방을 종료할까요?')){
      await majorityCommand(op,route()[1],{choice:id,round:majorityState?.round},button);
    }
    return;
  }
  if(action==='admin-password'){
    const input=app.querySelector('#admin-password');
    const visible=input.type==='password';
    input.type=visible?'text':'password';
    button.textContent=visible?'숨기기':'보기';
    return;
  }
  if(action.startsWith('nominate-')){
    if(action==='nominate-toggle')nominateHidden=!nominateHidden;
    if(action==='nominate-retry')nominateFailed=false;
    if(action==='nominate-edit'){nominateEdit=nominateCards?.find(card=>card.id===id);render();app.querySelector('#nominate-admin textarea')?.focus();return;}
    if(action==='nominate-cancel')nominateEdit=null;
    if(action==='nominate-delete'){
      if(!isAdmin()||mutationPending||!nominateCards?.some(card=>card.id===id))return;
      mutationPending=true;
      button.disabled=true;
      try{
        await request(nominateTable+'?id=eq.'+encodeURIComponent(id),{method:'DELETE',admin:true,write:true});
        nominateCards=nominateCards.filter(card=>card.id!==id);
        if(nominateEdit?.id===id){nominateEdit=null;if(button.isConnected)render();}
        else button.closest('.truth-card-row')?.remove();
        const title=app.querySelector('#nominate-list-title');
        if(title)title.textContent='등록된 카드 · '+nominateCards.length+'장';
        if(!nominateCards.length&&title)render();
        issue('카드를 삭제했어요.');
      }catch{issue('카드를 삭제하지 못했어요. 관리자 로그인과 연결을 확인해 주세요.');}
      finally{mutationPending=false;button.disabled=false;}
      return;
    }
    render();return;
  }
  if(action.startsWith('truth-')){
    if(action==='truth-next'&&++truthIndex>=truthDeck.length){location.hash='/truth';return;}
    if(action==='truth-retry')truthFailed=false;
    if(action==='truth-edit'){truthEdit=truthCards?.find(card=>card.id===id);render();app.querySelector('#truth-admin textarea')?.focus();return;}
    if(action==='truth-cancel')truthEdit=null;
    if(action==='truth-delete'){
      if(!isAdmin()||mutationPending||!truthCards?.some(card=>card.id===id))return;
      mutationPending=true;
      button.disabled=true;
      try{
        await request(truthTable+'?id=eq.'+encodeURIComponent(id),{method:'DELETE',admin:true,write:true});
        truthCards=truthCards.filter(card=>card.id!==id);
        if(truthEdit?.id===id){truthEdit=null;if(button.isConnected)render();}
        else button.closest('.truth-card-row')?.remove();
        const title=app.querySelector('#truth-list-title');
        if(title)title.textContent='등록된 카드 · '+truthCards.length+'장';
        if(!truthCards.length&&title)render();
        issue('카드를 삭제했어요.');
      }catch{issue('카드를 삭제하지 못했어요. 관리자 로그인과 연결을 확인해 주세요.');}
      finally{mutationPending=false;button.disabled=false;}
      return;
    }
    render();return;
  }
  if(action.startsWith('mafia-')){
    const op=action.slice(6);
    if(op==='close'&&!confirm('모든 참가자의 방을 종료할까요?'))return;
    await mafiaCommand(op,route()[1],{target:id,verdict:id,phase:mafiaState?.phase},button);
    return;
  }
  if(action==='liar-edit'&&!mutationPending){
    const pair=managedRows[Number(id)];
    if(!pair)return;
    selectManagedPair(pair);
    issue('');
    app.querySelector('#liar-manage [name=word_a]').focus();
  }else if(action==='liar-edit-cancel'){
    selectManagedPair(null);
    issue('');
  }else if(action==='liar-remove'&&managedPair&&confirm('이 단어 쌍을 삭제할까요?')){
    await saveManagedPair(app.querySelector('#liar-manage'),true);
  }else if(action==='open-category'){
    const picker=app.querySelector('#category-picker');
    picker.showModal();
    picker.querySelector('[aria-pressed="true"]')?.focus();
  }else if(action==='close-category'){
    app.querySelector('#category-picker').close();
  }else if(action==='pick-category'){
    const picker=app.querySelector('#category-picker');
    app.querySelector('#liar-setup [name="category"]').value=id;
    app.querySelector('#category-value').textContent=id||'무작위';
    for(const option of picker.querySelectorAll('.picker-option')){
      const selected=option===button;
      option.setAttribute('aria-pressed',String(selected));
      option.lastElementChild.textContent=selected?'✓':'';
    }
    picker.close();
  }else if(action==='liar-reveal'&&liarRound?.phase==='pass'){liarRound.revealed=true;render();}
  else if(action==='liar-next'&&liarRound?.revealed){
    liarRound.revealed=false;
    if(++liarRound.index===liarRound.count)liarRound.phase='vote';
    render();
  }else if(action==='refresh'){
    await refreshCloud();
    if(!app.querySelector('form'))render();else updateSyncStatus();
  }else if(action==='answer'&&isAdmin()){
    answerVisible=!answerVisible;
    document.querySelector('#answer').hidden=!answerVisible;
    button.textContent=answerVisible?'정답 숨기기':'정답 보기';
    button.setAttribute('aria-expanded',String(answerVisible));
  }else if(action==='preset'){
    document.querySelector('[name="seconds"]').value=seconds;
  }else if(action==='next'&&game&&!game.done){
    if(Date.now()>=game.deadline)finish('time');
    else if(game.index===game.words.length-1){game.index++;finish('complete');}
    else{game.index++;render();app.querySelector('.word-card')?.focus();}
  }else if(action==='restart'&&game){
    const set=records('sets').find(item=>item.id===game.id);
    if(set){begin(set,game.seconds);render();}
  }else if(action==='delete-set'){
    const list=records('sets');
    const set=list.find(item=>item.id===id);
    if(!set||!confirm('“'+set.title+'” 카드 세트를 삭제할까요?'))return;
    if(!await storeChange('sets',list.filter(item=>item.id!==id),{method:'DELETE',id})){issue(saveError());return;}
    location.hash='/cards';
  }else if(action==='delete'&&confirm('이 문제를 삭제할까요?')){
    if(!await storeChange('mysteries',records('mysteries').filter(item=>item.id!==id),{method:'DELETE',id})){issue(saveError());return;}
    location.hash='/admin';
  }else if(action==='up'||action==='down'){
    const list=[...records('mysteries')];
    const index=list.findIndex(item=>item.id===id),next=index+(action==='up'?-1:1);
    if(index<0||next<0||next>=list.length)return;
    [list[index],list[next]]=[list[next],list[index]];
    if(await storeChange('mysteries',list,{method:'MOVE',id,up:action==='up'}))render();
    else issue(saveError());
  }
});
window.addEventListener('hashchange',()=>{render();refreshPage();mafiaPoll();majorityPoll();});
setInterval(()=>{updateMafiaClock();mafiaPoll();majorityPoll();},1250);
mafiaPoll();
majorityPoll();
window.addEventListener('online',refreshPage);
window.addEventListener('storage',()=>{if(route()[2]!=='play'&&!app.querySelector('form'))render();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(document.querySelector('#clock'))updateClock();refreshPage();}});
render();
refreshPage();
</script>
